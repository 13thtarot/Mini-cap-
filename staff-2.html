<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fairytale Nails Staff Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf8f3;
        --card: #fff;
        --ink: #2e3328;
        --head: #7a6a48;
        --mute: #6f7466;
        --sage: #dde6d2;
        --deep: #4e6240;
        --red: #c43d36;
        --pink: #fbe6e6;
        --beige: #f0ebdc;
        --line: #e8e4d8;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1f18;
          --card: #262a21;
          --ink: #eef0e6;
          --head: #d6c79c;
          --mute: #a9ae9c;
          --sage: #2f3a28;
          --deep: #6f8a5a;
          --red: #e8625b;
          --pink: #3a2626;
          --beige: #2d2b21;
          --line: #3a3e32;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1f18;
        --card: #262a21;
        --ink: #eef0e6;
        --head: #d6c79c;
        --mute: #a9ae9c;
        --sage: #2f3a28;
        --deep: #6f8a5a;
        --red: #e8625b;
        --pink: #3a2626;
        --beige: #2d2b21;
        --line: #3a3e32;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.55 Poppins,
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3,
      .ttl {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
        color: var(--head);
        margin: 0 0 0.4em;
        line-height: 1.1;
      }
      h1 {
        font-size: clamp(2.4rem, 7vw, 4rem);
      }
      h2 {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }
      h3 {
        font-size: 1.25rem;
      }
      small,
      .mute {
        color: var(--mute);
        font-size: 0.8rem;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 1.1rem;
        background: var(--red);
        color: #fff;
        font-weight: 500;
        cursor: pointer;
      }
      .btn.w {
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line);
      }
      .btn.sm {
        padding: 0.3rem 0.7rem;
        font-size: 0.8rem;
        border-radius: 8px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--deep);
        outline-offset: 2px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.7rem 1.4rem;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        flex-wrap: wrap;
      }
      .top nav {
        display: flex;
        gap: 1.4rem;
        margin: 0 auto;
      }
      .top nav a {
        cursor: pointer;
        color: var(--ink);
        padding-bottom: 3px;
        border-bottom: 2px solid transparent;
      }
      .top nav a.on {
        border-color: var(--red);
      }
      .logo {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        cursor: pointer;
      }
      .logo i {
        font:
          italic 1.3rem "DM Serif Display",
          serif;
        color: var(--head);
        display: block;
        line-height: 1;
      }
      .logo small {
        font-size: 0.55rem;
        letter-spacing: 0.15em;
        display: block;
      }
      .lg {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--pink);
        display: grid;
        place-items: center;
        font:
          italic 1.3rem "DM Serif Display",
          serif;
        color: var(--red);
      }
      .hero {
        background: var(--sage);
        padding: 3rem 1.4rem;
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
      }
      .two {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 2rem;
        align-items: center;
      }
      .hero h1 em {
        color: var(--red);
      }
      .tag {
        display: inline-block;
        background: var(--card);
        border-radius: 99px;
        padding: 0.25rem 0.8rem;
        font-size: 0.75rem;
        margin-bottom: 1rem;
      }
      .arch {
        width: min(100%, 290px);
        aspect-ratio: 3/4;
        border-radius: 145px 145px 24px 24px;
        background: var(--pink);
        display: grid;
        place-items: center;
        margin-left: auto;
      }
      .bot i {
        display: block;
        width: 34px;
        height: 40px;
        background: #e6c9b4;
        margin: 0 auto;
        border-radius: 6px 6px 0 0;
      }
      .bot b {
        display: grid;
        place-items: center;
        width: 112px;
        height: 122px;
        border-radius: 22px;
        background: linear-gradient(145deg, #f09aa6, #d9708a);
        color: #fff;
        font:
          italic 1.3rem "DM Serif Display",
          serif;
      }
      .sec {
        padding: 3rem 1.4rem;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 1rem;
      }
      .fav {
        border-radius: 18px;
        padding: 1.2rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        cursor: pointer;
        border: 0;
        text-align: left;
        color: var(--ink);
        width: 100%;
      }
      .fav .ic {
        width: 54px;
        height: 64px;
        border-radius: 27px 27px 10px 10px;
        background: var(--bg);
        display: grid;
        place-items: center;
        color: var(--red);
        font-size: 1.3rem;
        flex: none;
      }
      .band {
        background: var(--deep);
        color: #fff;
        padding: 3rem 1.4rem;
        text-align: center;
      }
      .band h2 {
        color: #fff;
      }
      .steps4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 1.4rem;
        text-align: left;
        margin-top: 2rem;
      }
      .steps4 b {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--pink);
        color: var(--deep);
        font-size: 0.7rem;
      }
      .steps4 h3 {
        color: #fff;
        margin: 0.6rem 0 0.2rem;
        font-size: 1.1rem;
      }
      .steps4 p {
        margin: 0;
        font-size: 0.8rem;
        opacity: 0.8;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
        padding: 2rem 1.4rem;
        border-top: 1px solid var(--line);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.1rem;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        margin: 1rem 0;
      }
      .tabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        padding: 0.6rem;
        color: var(--mute);
        cursor: pointer;
      }
      .tabs .on {
        color: var(--ink);
        border-color: var(--ink);
        font-weight: 600;
      }
      .pr {
        color: var(--red);
        font-weight: 600;
      }
      .chips {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.8rem 0;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 99px;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
      }
      .chip.on {
        background: var(--deep);
        color: #fff;
        border-color: var(--deep);
      }
      .chip:disabled {
        opacity: 0.35;
        text-decoration: line-through;
      }
      .opt {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
        text-align: left;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.8rem 1rem;
        margin-bottom: 0.6rem;
        cursor: pointer;
      }
      .opt.on {
        border-color: var(--deep);
        box-shadow: 0 0 0 2px var(--deep);
      }
      .sp {
        display: flex;
        gap: 0.8rem;
        overflow-x: auto;
      }
      .sp button {
        flex: 0 0 120px;
        text-align: center;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.8rem;
        cursor: pointer;
      }
      .sp .on {
        border-color: var(--deep);
        box-shadow: 0 0 0 2px var(--deep);
      }
      .av {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        margin: 0 auto 0.3rem;
        display: grid;
        place-items: center;
        background: var(--pink);
        color: var(--deep);
        font-weight: 600;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
        max-width: 360px;
      }
      .cal b {
        font-size: 0.75rem;
        color: var(--mute);
      }
      .cal button {
        aspect-ratio: 1;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--ink);
        cursor: pointer;
      }
      .cal .on {
        background: var(--red);
        color: #fff;
      }
      .cal button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      label {
        display: block;
        margin: 0.7rem 0 0.2rem;
        font-weight: 500;
      }
      input,
      select {
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
      }
      .msg {
        padding: 0.6rem 0.9rem;
        border-radius: 10px;
        margin: 0.7rem 0;
        background: var(--pink);
        color: var(--red);
      }
      .ok {
        background: var(--sage);
        color: var(--deep);
      }
      .row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .shell {
        display: grid;
        grid-template-columns: 210px 1fr;
        min-height: 100vh;
      }
      aside {
        background: color-mix(in srgb, var(--sage) 40%, var(--bg));
        border-right: 1px solid var(--line);
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      aside .nv {
        padding: 0.5rem 0.7rem;
        border-radius: 8px;
        cursor: pointer;
      }
      aside .nv.on {
        background: var(--card);
        font-weight: 600;
        box-shadow: 0 0 0 1px var(--line);
      }
      aside .me {
        margin-top: auto;
        display: flex;
        gap: 0.6rem;
        align-items: center;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .pad {
        padding: 1.5rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 1rem;
        margin: 1.2rem 0;
      }
      .stat b {
        font-size: 1.7rem;
        display: block;
        line-height: 1.2;
      }
      .stat.dk {
        background: var(--deep);
        color: #fff;
        border: 0;
      }
      .stat.dk small {
        color: #dfe8d4;
      }
      .tbl {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 620px;
      }
      th {
        background: var(--bg);
        color: var(--mute);
        font-weight: 400;
        font-size: 0.75rem;
      }
      td,
      th {
        padding: 0.6rem 0.7rem;
        text-align: left;
        border-bottom: 1px solid var(--line);
        font-size: 0.82rem;
      }
      .pill {
        border-radius: 99px;
        padding: 0.15rem 0.6rem;
        font-size: 0.72rem;
        font-weight: 500;
        background: var(--pink);
        color: var(--red);
      }
      .pill.service,
      .pill.completed {
        background: var(--sage);
        color: var(--deep);
      }
      .pill.pending,
      .pill.waiting {
        background: var(--beige);
        color: var(--head);
      }
      .seg {
        display: flex;
        gap: 6px;
      }
      .seg i {
        height: 7px;
        flex: 1;
        max-width: 60px;
        border-radius: 9px;
        background: var(--line);
      }
      .seg i.f {
        background: var(--deep);
      }
      .g2 {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 170px;
      }
      .chart i {
        flex: 1;
        background: var(--deep);
        border-radius: 3px 3px 0 0;
        opacity: 0.85;
      }
      .chart i.lo {
        background: var(--red);
      }
      .heat {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 6px;
      }
      .heat i {
        height: 44px;
        border-radius: 6px;
        background: var(--deep);
      }

      @media (max-width: 760px) {
        .two,
        .g2 {
          grid-template-columns: 1fr;
        }
        .arch {
          margin: 0;
        }
        .shell {
          grid-template-columns: 1fr;
        }
        aside {
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
        }
        aside .me {
          display: none;
        }
      }
      .btn.o {
        background: none;
        color: var(--red);
        box-shadow: inset 0 0 0 1px var(--red);
      }
      .tag {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .ph {
        position: relative;
        border-radius: 22px;
        overflow: hidden;
        background: var(--beige);
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .ph span {
        position: absolute;
        left: 10px;
        bottom: 10px;
        background: rgba(255, 255, 255, 0.93);
        color: #2a2a2a;
        border-radius: 99px;
        padding: 0.18rem 0.7rem;
        font-size: 0.7rem;
        font-weight: 500;
      }
      .hp {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        align-items: start;
      }
      .hp > div {
        display: grid;
        gap: 14px;
      }
      .hp > div + div {
        margin-top: 44px;
      }
      .t1 {
        aspect-ratio: 271/320;
      }
      .t3 {
        aspect-ratio: 271/230;
      }
      .gal {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        align-items: start;
      }
      .ph.a {
        aspect-ratio: 361/246;
      }
      .ph.b {
        aspect-ratio: 361/213;
        margin-top: 17px;
      }
      .ph.c {
        aspect-ratio: 361/214;
      }
      @media (max-width: 760px) {
        .gal {
          grid-template-columns: repeat(2, 1fr);
        }
        .ph.b {
          margin-top: 0;
        }
        .hp {
          margin-top: 1rem;
        }
      }
      .mb {
        position: fixed;
        inset: 0;
        background: #0007;
        display: grid;
        place-items: center;
        z-index: 20;
        padding: 1rem;
      }
      .mc {
        background: var(--card);
        color: var(--ink);
        border-radius: 16px;
        padding: 1.4rem;
        width: min(460px, 100%);
        max-height: 90vh;
        overflow: auto;
      }
      .mc.rc {
        width: 340px;
      }
      .mc hr {
        border: 0;
        border-top: 1px dashed var(--line);
        margin: 0.7rem 0;
      }
      .mc h3 {
        margin-bottom: 0.5rem;
      }
      textarea {
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .pill.noshow,
      .pill.cancelled,
      .pill.refunded {
        background: var(--pink);
        color: var(--red);
      }
      @media print {
        .noprint,
        header.top,
        .foot {
          display: none !important;
        }
        .shell {
          display: block;
        }
        body.rcp #app {
          display: none;
        }
        body.rcp .mb {
          position: static;
          background: none;
        }
        body {
          background: #fff;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="md"></div>
    <script>
      const $ = (q) => document.querySelector(q),
        php = (n) => "₱" + Math.round(n).toLocaleString(),
        pad = (n) => String(n).padStart(2, "0"),
        fmt = (d) =>
          d.getFullYear() +
          "-" +
          pad(d.getMonth() + 1) +
          "-" +
          pad(d.getDate()),
        today = () => fmt(new Date()),
        esc = (s) =>
          String(s ?? "")
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;"),
        key = (a) => a.date + String(a.start).padStart(4, "0");
      const m2t = (m) => {
        const h = Math.floor(m / 60);
        return (h % 12 || 12) + ":" + pad(m % 60) + (h < 12 ? " AM" : " PM");
      };
      const durT = (m) =>
        m >= 60
          ? +(m / 60).toFixed(2) + (m === 60 ? " hr" : " hrs")
          : m + " min";
      const GR = [
          "Basic Care",
          "Gel Services",
          "Relaxation",
          "Nail Enhancements",
          "Packages",
          "Removal",
          "Nail Art Add-Ons",
          "Per Nail Add-Ons",
        ],
        GN = {
          "Per Nail Add-Ons":
            "Price per nail. Only applies if you prefer not to get a full set of nail art.",
        };
      const SV = [
        ["Kids Manicure", 0, 100, 0, 30],
        ["Regular Manicure", 0, 180, 0, 30],
        ["Regular Pedicure", 0, 200, 0, 45],
        ["Regular Mani + Pedi", 0, 380, 0, 75],
        ["Gel Manicure", 1, 450, 0, 45],
        ["Gel Pedicure", 1, 500, 0, 45],
        ["Gel Mani + Gel Pedi", 1, 900, 0, 90, 0, "Save ₱50"],
        ["Footspa + Gel Pedi", 1, 850, 0, 90, 0, "Save ₱30"],
        ["Footspa + Gel Mani + Gel Pedi", 1, 1280, 0, 135, 0, "Save ₱50"],
        ["Footspa", 2, 380, 0, 45],
        ["Footspa + Regular Pedi", 2, 580, 0, 75],
        ["Softgel Extensions", 3, 1000, 0, 120],
        ["BIAB Overlay", 3, 900, 0, 90],
        ["Self-Care Day", 4, 820, 0, 90, 0, "Footspa + Gel Mani"],
        ["Pamper Me", 4, 850, 0, 90, 0, "Footspa + Gel Pedi"],
        ["Full Glam", 4, 1280, 0, 135, 0, "Footspa + Gel Mani + Gel Pedi"],
        [
          "Luxury Set",
          4,
          1800,
          0,
          180,
          0,
          "Plain Softgel Extensions + Footspa + Gel Pedi",
        ],
        ["Gel Polish Removal", 5, 0, 0, 15, 0, "Free for returning clients"],
        ["Foreign Gel Polish Removal", 5, 100, 0, 20],
        ["Extension Removal", 5, 150, 0, 30],
        ["BIAB Removal", 5, 150, 0, 30],
        ["Foreign Nail Enhancements Removal", 5, 300, 0, 45],
        ["Glitter Accent", 6, 0, 0, 10, 0, "Free"],
        ["Simple Nail Art", 6, 50, 100, 30, 60, "1-2 nails"],
        ["Full Nail Art", 6, 300, 0, 60, 0, "3 nails to full set"],
        ["Complex", 6, 500, 0, 90, 0, "Detailed, multiple techniques"],
        ["Super", 6, 800, 0, 120, 0, "Full set of intricate designs"],
        [
          "EXTRA",
          6,
          1000,
          2000,
          150,
          180,
          "Time-intensive, premium techniques",
        ],
        ["Pet Portraits", 7, 100, 200, 15, 30],
        ["3D Flowers", 7, 100, 0, 15],
        ["3D Embossed Lines, drops, etc.", 7, 100, 0, 15],
        ["Character Drawing", 7, 100, 200, 15, 30],
      ].map((s, i) => ({
        id: i + 1,
        n: s[0],
        g: GR[s[1]],
        p: s[2],
        px: s[3] || 0,
        d: s[4],
        dx: s[5] || 0,
        x: s[6] || "",
      }));
      const TE0 = [
        ["Nina", "Gel & extensions", 1],
        ["Koye", "Pedicure & spa", 2],
        ["Joy", "Extensions", 3],
        ["Mina", "Nail art", 4],

        if (a)
          a.items.forEach((i) => {
            BL.items[i] = DB.SV.find((s) => s.id === i).p;
            BL.tech[i] = a.staff || 0;
          });
        render();
      }
      function bit(id, on) {
        const s = DB.SV.find((x) => x.id === id);
        if (on) {
          BL.items[id] = s.p;
          BL.tech[id] = (DB.appts.find((x) => x.id == BL.a) || {}).staff || 0;
        } else {
          delete BL.items[id];
          delete BL.tech[id];
        }
        render();
      }
      function bamt(id, v) {
        const s = DB.SV.find((x) => x.id === id);
        BL.items[id] = Math.min(s.px, Math.max(s.p, +v || s.p));
        render();
      }
      function sbill() {
        const T = DB.appts.filter((a) => a.date === today()),
          open = T.filter(
            (a) =>
              ![
                "completed",
                "refunded",
                "voided",
                "cancelled",
                "noshow",
              ].includes(a.status),
          ),
          A = DB.appts.find((x) => x.id == BL.a),
          sub = bsub(),
          vat = sub * 0.12,
          dep = A && A.depOk ? 250 : 0,
          due = Math.max(0, sub + vat - dep),
          tx = T.filter(
            (a) =>
              ["completed", "refunded", "voided"].includes(a.status) && a.pt,
          ),
          ok = tx.filter((a) => a.status === "completed"),
          by = (m) =>
            ok.filter((a) => a.method === m).reduce((t, a) => t + a.total, 0);
        return `<div class="g2" style="grid-template-columns:1.5fr 1fr"><div class="card"><b>New transaction</b><label>Appointment</label><select onchange="pickA(this.value)"><option value="">Manual walk-in transaction</option>${open.map((a) => `<option value="${a.id}" ${BL.a == a.id ? "selected" : ""}>${m2t(a.start)} · ${esc(a.name)} · ${a.svc}</option>`).join("")}</select>${A ? "" : fld("bl_n", "Walk-in customer name", "text", BL.n).replace("<input", '<input onchange="BL.n=this.value"')}<label>Services</label>${SVA()
          .map(
            (s) =>
              `<div class="row" style="padding:.3rem 0;border-bottom:1px solid var(--line)"><label style="margin:0;font-weight:400"><input type="checkbox" style="width:auto" ${BL.items[s.id] != null ? "checked" : ""} onchange="bit(${s.id},this.checked)"> ${s.n}</label>${s.px && BL.items[s.id] != null ? `<input type="number" style="width:110px" min="${s.p}" max="${s.px}" value="${BL.items[s.id]}" onchange="bamt(${s.id},this.value)" aria-label="Nail art price">` : `<span class="pr">${prs(s)}</span>`}${BL.items[s.id] != null ? `<select style="width:150px" aria-label="Technician for ${esc(s.n)}" onchange="BL.tech[${s.id}]=+this.value;render()"><option value="0">Technician...</option>${TE.map((t) => `<option value="${t.id}" ${BL.tech[s.id] === t.id ? "selected" : ""}>${esc(t.n)}</option>`).join("")}</select>` : ""}</div>`,
          )
          .join(
            "",
          )}<label>Payment method</label><div class="chips">${["cash", "gcash"].map((m) => `<button class="chip ${BL.m === m ? "on" : ""}" onclick="BL.m='${m}';render()">${m === "cash" ? "Cash" : "GCash"}</button>`).join("")}</div></div>
<div><div class="card" style="margin-bottom:1rem"><b>Summary</b>${[
          ["Subtotal", php(sub)],
          ["VAT 12%", php(vat)],
          ["Reservation fee", dep ? "- " + php(dep) : "₱0"],
          ["Total due", php(due)],
        ]
          .map(
            (r, i) =>
              `<div class="row" style="padding:.3rem 0;${i === 3 ? "border-top:1px solid var(--line);font-weight:600" : ""}"><span>${r[0]}</span><span>${r[1]}</span></div>`,
          )
          .join(
            "",
          )}${A && A.dep && !A.depOk ? "<small>The ₱250 deposit is not verified yet, so it is not deducted.</small>" : ""}<div id="ae"></div><button class="btn" style="width:100%" onclick="pay()">Generate Receipt</button></div>
<div class="card" style="background:var(--pink)"><small style="letter-spacing:.12em">TODAY'S SALES SUMMARY</small><div class="row"><span>Cash</span><b>${php(by("cash"))}</b></div><div class="row"><span>GCash</span><b>${php(by("gcash"))}</b></div><div class="row" style="border-top:1px solid var(--line)"><span>${ok.length} transactions</span><b>${php(by("cash") + by("gcash"))}</b></div></div></div></div>
<div class="card" style="margin-top:1rem"><b>Today's transactions</b><div class="tbl"><table><tr><th>Receipt</th><th>Customer</th><th>Method</th><th>Total</th><th>Status</th><th></th></tr>${tx.map((a) => `<tr><td>${a.code}</td><td>${esc(a.name)}</td><td>${a.method}</td><td>${php(a.total)}</td><td>${pill(a.status)}</td><td><button class="btn sm w" onclick="rcpt(${a.id})">Receipt</button> <button class="btn sm w" onclick="showH(${a.id})">History</button> ${a.status === "completed" ? `<button class="btn sm w" onclick="askVoid(${a.id},'Refund')">Refund</button> <button class="btn sm w" onclick="askVoid(${a.id},'Void')">Void</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="6">No transactions yet today.</td></tr>'}</table></div></div>`;
      }
      function pay() {
        const sub = bsub();
        let A = DB.appts.find((x) => x.id == BL.a);
        const E = (m) => ($("#ae").innerHTML = `<div class="msg">${m}</div>`);
        if (!sub) return E("Pick at least one service.");
        if (!A && BL.n.trim().length < 2)
          return E("Enter the walk-in customer name.");
        const ids = Object.keys(BL.items);
        if (ids.some((i) => !BL.tech[i]))
          return E("Choose a technician for every service line.");
        const lines = ids.map((i) => ({
          id: +i,
          n: DB.SV.find((s) => s.id == i).n,
          p: BL.items[i],
          tech: BL.tech[i],
        }));
        if (!A) {
          const d = new Date();
          A = {
            id: Date.now(),
            code: "FN-W" + (Date.now() % 1e4),
            name: BL.n.trim(),
            phone: "",
            date: today(),
            start: d.getHours() * 60 + d.getMinutes(),
            dur: 0,
            dep: 0,
            depOk: false,
            staff: 0,
            station: 0,
            walkin: 1,
            hist: [],
          };
          DB.appts.push(A);
        }
        const du = A.depOk ? 250 : 0;
        Object.assign(A, {
          items: ids.map(Number),
          svc: lines.map((l) => l.n).join(", "),
          lines,
          price: sub,
          sub,
          vat: sub * 0.12,
          total: sub * 1.12,
          depUsed: du,
          due: Math.max(0, sub * 1.12 - du),
          method: BL.m,
          pt: Date.now(),
          by: ST.name,
          status: "completed",
        });
        logH(A, `Payment received (${BL.m}) ${php(A.total)}`, ST.name);
        save();
        BL = { a: "", n: "", items: {}, tech: {}, m: "cash" };
        render();
        rcpt(A.id);
      }
      function rcpt(id) {
        const a = DB.appts.find((x) => x.id === id),
          L = a.lines || [{ n: a.svc, p: a.sub ?? a.price }];
        document.body.classList.add("rcp");
        $("#md").innerHTML =
          `<div class="mb"><div class="mc rc"><div style="text-align:center"><b class="ttl" style="font-size:1.4rem">Fairytale Nails Salon</b><br><small>Receipt ${a.code}<br>${new Date(a.pt || Date.now()).toLocaleString()}<br>Customer: ${esc(a.name)}</small></div><hr>${L.map((l) => `<div class="row"><span>${l.n}${l.tech ? " (" + esc(te(l.tech)) + ")" : ""}</span><span>${php(l.p)}</span></div>`).join("")}<hr><div class="row"><span>Subtotal</span><span>${php(a.sub ?? a.price)}</span></div><div class="row"><span>VAT 12%</span><span>${php(a.vat ?? (a.sub ?? a.price) * 0.12)}</span></div><div class="row"><span>Reservation fee</span><span>- ${php(a.depUsed ?? (a.depOk ? 250 : 0))}</span></div><div class="row"><b>Total paid</b><b>${php(a.due ?? Math.max(0, a.total - (a.depUsed ?? (a.depOk ? 250 : 0))))}</b></div><small>Paid by ${a.method || "-"} · Cashier ${esc(a.by || "-")}</small><p class="noprint row" style="margin-bottom:0"><button class="btn w" onclick="modal()">Close</button><button class="btn" onclick="print()">Print</button></p></div></div>`;
      }
      const askVoid = (id, w) =>
        modal(
          `<h3>${w} this transaction?</h3><p>This removes it from today's sales and is recorded under ${esc(ST.name)}. It cannot be undone here.</p>${MF(`<button class="btn w" onclick="modal()">Keep it</button><button class="btn" onclick="doVoid(${id},'${w}')">${w}</button>`)}`,
        );
      function doVoid(id, w) {
        const a = DB.appts.find((x) => x.id === id);
        a.status = w === "Refund" ? "refunded" : "voided";
        a.rf = w + " by " + ST.name;
        logH(a, w === "Refund" ? "Refunded" : "Voided", ST.name);
        save();
        modal();
        render();
      }
      const plHTML = () =>
        `<section class="sec"><div class="wrap" style="max-width:380px"><div class="lg" style="width:56px;height:56px;font-size:2rem;margin:0 auto 1rem">f</div><h2 style="text-align:center">${V === "owner" ? "Owner" : "Staff"} sign in</h2><div class="card">${fld("lu", "Username")}${fld("lp", "Password", "password").replace("<input", "<input onkeydown=\"if(event.key==='Enter')plog()\"")}<div id="le"></div><p><button class="btn" style="width:100%" onclick="plog()">Sign in</button></p>${DEMO ? `<small>Demo: ${V === "owner" ? "owner / owner123" : "mika / staff123 or paolo / staff123"}</small>` : ""}</div></div></section>`;
      function plog() {
        const u = $("#lu").value.trim().toLowerCase(),
          p = $("#lp").value,
          o = OWNR(),
          st = DB.staff.find((x) => x.user === u && x.pass === p && x.on),
          ow = !!(o && o.user === u && o.pass === p),
          cu = DB.users.some(
            (x) =>
              (x.user.toLowerCase() === u || x.email.toLowerCase() === u) &&
              x.pass === p,
          );
        if (V === "staff" && st) {
          ST = st;
          setSess({ role: "staff", id: st.id, name: st.name });
          return render();
        }
        if (V === "owner" && ow) {
          OW = 1;
          setSess({ role: "owner", id: "owner", name: o.name || o.user });
          return render();
        }
        const other =
          V !== "staff" && st
            ? "staff portal (staff.html)"
            : V !== "owner" && ow
              ? "owner portal (owner.html)"
              : cu
                ? "customer site (customer.html)"
                : "";
        $("#le").innerHTML =
          `<div class="msg">${other ? "That account belongs to the " + other + "." : "Wrong username or password."}</div>`;
      }
      const PG = () => ({
        dash: sdash,
        appts: sappts,
        cust: scust,
        bill: sbill,
      });
      function render() {
        const logo =
          '<span class="logo" onclick="go(\'dash\')"><span class="lg">f</span><span><i>fairytale</i><small>NAILS SALON</small></span></span>';
        const o = V === "owner";
        if (o ? !OW : !ST) {
          $("#app").innerHTML = plHTML();
          return;
        }
        const nm = o ? OWNR().name || OWNR().user : ST.name,
          pg = (PG()[P] || PG().dash)();
        $("#app").innerHTML =
          `<div class="shell"><aside class="noprint">${logo}<small style="margin:1rem 0 .4rem;letter-spacing:.12em">${o ? "OWNER" : "STAFF"} PORTAL</small>${NAVS[V].map(([k, l]) => `<div class="nv ${P === k ? "on" : ""}" onclick="go('${k}')">${l}</div>`).join("")}<div class="me"><span class="lg" style="font:600 .8rem Poppins">${nm
            .split(" ")
            .map((x) => x[0])
            .join(
              "",
            )}</span><span><b>${nm}</b><br><small>${o ? "Salon Owner" : "Receptionist-manager"}</small><br><a class="pr" style="cursor:pointer;font-size:.75rem" onclick="clearSess();ST=null;OW=0;render()">Sign out</a></span></div></aside><section><div class="bar noprint"><div><span class="ttl" style="font-size:1.4rem">${NAVS[V].find((x) => x[0] === P)[1]}</span><br><small>${new Date().toLocaleDateString("en", { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</small></div><span><small>Signed in as</small> <b>${nm}</b></span></div><div class="pad">${pg}</div></section></div>`;
      }
      addEventListener("storage", (e) => {
        if (e.key !== "ftn4" || !e.newValue) return;
        try {
          const n = JSON.parse(e.newValue);
          DB = n;
          TE.length = 0;
          TE.push(...n.TE);
          DB.TE = TE;
          if (U) U = DB.users.find((x) => x.id === U.id) || U;
          if (ST) ST = DB.staff.find((x) => x.id === ST.id) || ST;
          if (
            !$("#md").innerHTML &&
            !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)
          )
            render();
        } catch (x) {}
      });
      render();
    </script>
  </body>
</html>
